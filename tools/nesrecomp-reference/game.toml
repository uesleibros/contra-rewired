[game]
output_prefix = "contra"

[mapper]
# set_rom_bank_to_y ($C139) is the actual bank-switch write; load_bank_number
# ($C133) is the common call-site wrapper most of bank7.asm's "ldy #$0N; jsr
# load_bank_number" pattern actually targets. Both take the bank number via Y,
# not A - real Contra data (see src/bank7.asm in the disassembly this project
# already verified byte-for-byte against the real ROM).
bank_switch = [0xC133, 0xC139]

# run_routine_from_tbl_below (src/bank7.asm $C857): a shared "read the
# return address off the stack, use it as an inline jump-table base, jump
# to table[A]" helper - the classic 6502 trick where the table is embedded
# as raw bytes immediately after the JSR, and the routine never actually
# returns to its caller. Marking the shared helper's own address (not each
# call site) so it applies to every JSR that targets it.
[[inline_dispatch]]
addr = 0xC857  # run_routine_from_tbl_below itself

