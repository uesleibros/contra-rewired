[workspace]
resolver = "2"
members = [
    "crates/contra-core",
    "crates/contra-assets",
    "crates/contra-mods",
    "apps/contra-pc",
    "apps/contra-extract",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ueslei Paim"]
license = "MIT"
repository = "https://github.com/uesleibros/contra-rewired"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1.3"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
