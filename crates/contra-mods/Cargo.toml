[package]
name = "contra-mods"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lua modding API surface for contra-rewired. The 'lua' feature requires a C toolchain (mlua/vendored)."

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
mlua = { version = "0.9", features = ["lua54", "vendored"], optional = true }

[features]
default = []
lua = ["dep:mlua"]
