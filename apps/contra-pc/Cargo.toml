[package]
name = "contra-pc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Desktop front-end: window, framebuffer presentation, keyboard/gamepad input, config."

[[bin]]
name = "contra-pc"
path = "src/main.rs"

[dependencies]
contra-core = { path = "../../crates/contra-core" }
contra-assets = { path = "../../crates/contra-assets" }
contra-nes = { path = "../../crates/contra-nes" }
contra-mods = { path = "../../crates/contra-mods" }
bincode = { workspace = true }
winit = "0.29"
softbuffer = "0.4"
gilrs = "0.10"
cpal = "0.15"
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }

[features]
# Lua mod scripting. Off by default: mlua's vendored build needs a C
# toolchain (MSVC Build Tools on Windows, gcc/clang elsewhere) not every
# contributor has installed. `cargo build --features mods` to enable.
mods = ["contra-mods/lua"]
